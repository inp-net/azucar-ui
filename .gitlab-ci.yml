image: node:20

stages:
  - build
  - publish

variables:
  PNPM_HOME: /root/.local/share/pnpm
  PATH: $PNPM_HOME:$PATH

before_script:
  - corepack enable
  - corepack prepare pnpm@latest --activate
  - pnpm install

build:
  stage: build
  script:
    - pnpm pack
  artifacts:
    paths:
      - dist

publish:
  stage: publish
  script:
    - echo "@inp-net:registry=https://git.inpt.fr/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" > .npmrc
    - echo "//git.inpt.fr/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - pnpm publish --no-git-checks
  rules:
    - if: $CI_COMMIT_TAG